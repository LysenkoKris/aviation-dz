spring:
  application:
    name: aviation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aviation}
    username: ${DB_USER:aviation}
    password: ${DB_PASSWORD:aviation}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    org.hibernate.SQL: debug
